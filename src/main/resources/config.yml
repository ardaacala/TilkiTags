chat:
  enabled: true
  # EssentialsXChat susturma, yerel sohbet alıcıları ve ücret kontrolleri korunur.
  # Sadece görünen biçim değiştirilir; çift prefix oluşmaması için tek tag kullanılır.
  format: '{tag}{name}&8 » &f{message}'
tab:
  enabled: true
nametag:
  enabled: true
  # Başka eklentinin nametag/collision takımını sessizce bozma.
  respect-existing-teams: true
pack:
